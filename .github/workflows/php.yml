
name: Deploy Laravel Backend

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath, pdo, mysql, zip

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Dependencies (CI Check)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader \
            --no-interaction

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH and Deployment Path
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            "deploy@$SERVER_IP" \
            "cd '$DEPLOY_PATH' && test -f artisan && test -f .env"

      - name: Deploy Files
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          rsync -az \
            --no-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/vendor/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ "deploy@$SERVER_IP:$DEPLOY_PATH/"

      - name: Run Laravel Deployment Commands
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            "deploy@$SERVER_IP" \
            "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -Eeuo pipefail

          maintenance_enabled=0

          cleanup() {
            if [ "$maintenance_enabled" -eq 1 ]; then
              php artisan up || true
            fi
          }

          trap cleanup EXIT

          # Protect production configuration.
          test -f .env
          test -f artisan

          # Ensure Laravel runtime directories exist.
          mkdir -p \
            storage/app \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/framework/testing \
            storage/logs \
            bootstrap/cache

          # Verify that deploy can write to Laravel's runtime directories.
          if [ ! -w storage/framework ] || [ ! -w bootstrap/cache ]; then
            echo "ERROR: deploy cannot write to storage/framework or bootstrap/cache."
            echo "Configure the appropriate server ownership, ACL, or group permissions."
            exit 1
          fi

          # Enter maintenance mode.
          php artisan down
          maintenance_enabled=1

          # Install production dependencies.
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

          # Apply database migrations.
          php artisan migrate --force

          # Clear and rebuild Laravel caches.
          php artisan optimize:clear
          php artisan storage:link
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Gracefully restart queue workers.
          php artisan queue:restart || true

          # Restore the application.
          php artisan up
          maintenance_enabled=0

          echo "Laravel deployment completed successfully."
          REMOTE
