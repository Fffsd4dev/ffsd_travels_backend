
name: Deploy Laravel Backend

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath, pdo, mysql, zip

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Dependencies (CI Check)
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy Files
        run: |
          rsync -az \
            --no-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/vendor/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ "deploy@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Run Laravel Deployment Commands
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            "deploy@${{ secrets.SERVER_IP }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && bash -s" <<'REMOTE'
          set -Eeuo pipefail

          # Always try to restore the application if deployment fails.
          maintenance_enabled=0

          cleanup() {
            if [ "$maintenance_enabled" -eq 1 ]; then
              php artisan up || true
            fi
          }

          trap cleanup EXIT

          # Confirm the application directory and required directories exist.
          test -f artisan
          mkdir -p storage/app \
                   storage/framework/cache/data \
                   storage/framework/sessions \
                   storage/framework/views \
                   storage/framework/testing \
                   storage/logs \
                   bootstrap/cache

          # Enable maintenance mode.
          php artisan down
          maintenance_enabled=1

          # Install production dependencies on the server.
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

          # Ensure the runtime directories are writable by their owner/group.
          chmod -R ug+rwX storage bootstrap/cache

          # Apply database changes and rebuild Laravel caches.
          php artisan migrate --force
          php artisan optimize:clear
          php artisan storage:link
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Ask running Laravel queue workers to restart gracefully.
          php artisan queue:restart || true

          # Restore the application.
          php artisan up
          maintenance_enabled=0

          echo "Laravel deployment completed successfully."
          REMOTE
